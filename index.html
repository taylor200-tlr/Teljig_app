<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style-worksheet.css">
    <link rel="manifest" href="/manifest.json">
    <script src="js/main.js" defer></script>
    <title>Teljesítési igazolás</title>
</head>

<body>

    <h1>Mennyit kerestem ma</h1>

    <div id="activitiesContainer"></div>

    <div class="total-container">
        <div class="total-label">Napi összesen:</div>
        <div id="totalPrice" class="total-amount">0 Ft</div>
    </div>

    <div class="button-row">
        <div class="left-buttons">
            <button id="resetButton" class="square-btn" title="Visszaállítás">🔄</button>
            <button id="statsButton" class="square-btn" title="Statisztika">📊</button>
        </div>
        <div class="right-buttons">
            <button id="deleteLastButton" class="square-btn danger-btn" title="Utolsó törlése">↩️</button>
        </div>
    </div>

    <div class="save-buttons-container">
        <button id="exportButton" class="main-save-btn">Mentés az adatbázisba</button>

        <button id="updateButton" class="main-save-btn update-btn" style="display: none;">💾 Módosítás mentése</button>
    </div>
    <div id="dailySummary" class="daily-summary">
        <h3>Mai mentések</h3>
        <div id="dailyList">
            <!-- Ide jönnek majd a sorok -->
        </div>
        <div class="daily-total">
            <strong>Ma összesen: <span id="todayGrandTotal">0 Ft</span></strong>
        </div>
    </div>
    <div id="bottomSheet" class="bottom-sheet">
        <div class="bottom-sheet-overlay" onclick="closeBottomSheet()"></div>
        <div class="bottom-sheet-content">
            <div class="bottom-sheet-bar"></div>
            <h4 id="sheetTitle">Művelet kiválasztása</h4>
            <button class="sheet-btn edit-btn" onclick="handleEditClick()">✏️ Szerkesztés</button>
            <button class="sheet-btn delete-btn" onclick="handleDeleteClick()">🗑️ Törlés</button>
            <button class="sheet-btn cancel-btn" onclick="closeBottomSheet()">Mégse</button>
        </div>
    </div>

</body>

</html>
